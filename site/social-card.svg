<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agent Middleware API</title>
  <desc id="desc">Authorize one agent action. Charge it once. Prove what happened.</desc>
  <!-- Source for social-card.png. Every color is a styles.css token (ink,
       panel, rule, text, text-dim, brass); the typefaces are the site's own —
       Libre Franklin for the headline, IBM Plex Mono for the labels.
       Regenerate the PNG with render_social_card.py so those faces render
       from the vendored fonts rather than a viewer's fallbacks. -->
  <defs>
    <!-- The glow sits at the top so the bottom row stays pure ink; the
         renderer probes that row to confirm the viewport covered the card. -->
    <radialGradient id="glow" cx="0.72" cy="-0.15" r="0.85">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset="0.55" stop-color="#1b1640" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0d0b1f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0d0b1f"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand row: the nav's gold mark and mono wordmark. -->
  <rect x="64" y="66" width="12" height="12" rx="2" fill="#ffc233"/>
  <text x="92" y="78" fill="#a49ddb" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="18" font-weight="600" letter-spacing="0.5">Agent Middleware API</text>

  <!-- Headline. -->
  <g fill="#eceafd" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-1.5">
    <text x="64" y="220">Authorize one agent action.</text>
    <text x="64" y="308">Charge it once.</text>
    <text x="64" y="396">Prove what happened.</text>
  </g>

  <rect x="64" y="470" width="1072" height="1" fill="#4a3d8f" fill-opacity="0.7"/>

  <g font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="17" font-weight="500" letter-spacing="2" fill="#eceafd">
    <text x="64" y="528">SCOPED AUTHORITY</text>
    <text x="410" y="528">IDEMPOTENT METERING</text>
    <text x="820" y="528">SIGNED RECEIPTS</text>
  </g>
  <g fill="#ffc233">
    <rect x="364" y="518" width="8" height="8" rx="2"/>
    <rect x="774" y="518" width="8" height="8" rx="2"/>
  </g>

  <g font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="16" fill="#a49ddb">
    <text x="64" y="580">www.thisisatest.tech</text>
    <text x="1136" y="580" text-anchor="end">One-tool design-partner pilot</text>
  </g>
</svg>
